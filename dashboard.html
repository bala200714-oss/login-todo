<!DOCTYPE html>
<html>
<head>
  <title>Pro Task Manager</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      block-size: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow: hidden;
    }

    .sidebar {
      inline-size: 240px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      color: white;
      padding: 25px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
    }

    .sidebar h2 {
      margin-block-end: 25px;
      font-weight: 600;
    }

    .sidebar button {
      inline-size: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .sidebar button:hover {
      background: #4facfe;
      transform: translateX(5px);
    }

    .main {
      flex: 1;
      padding: 25px;
      color: white;
      overflow-y: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top input {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      inline-size: 260px;
      outline: none;
      transition: 0.3s;
    }

    .top input:focus {
      transform: scale(1.05);
    }

    .filters {
      margin: 20px 0;
    }

    .filters button {
      margin-inline-end: 10px;
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .filters button.active {
      background: #4facfe;
      box-shadow: 0 0 10px rgba(79,172,254,0.7);
    }

    .filters button:hover {
      transform: scale(1.1);
    }

    .add-box {
      margin: 15px 0;
    }

    .add-box input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      inline-size: 250px;
      outline: none;
    }

    .add-box button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #4facfe;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-box button:hover {
      background: #00c6ff;
      transform: translateY(-2px);
    }

    .task-box {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      margin-block-start: 10px;
    }

    .task {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 15px;
      transition: 0.3s;
      animation: fadeIn 0.4s ease;
      cursor: pointer;
    }

    .task:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .task.completed {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #4facfe;
      margin-block-start: 8px;
      display: inline-block;
    }

    .actions {
      margin-block-start: 12px;
    }

    .actions button {
      margin-inline-end: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .edit { background: orange; }
    .delete { background: red; color: white; }

    .empty {
      text-align: center;
      margin-block-start: 60px;
      opacity: 0.7;
      font-size: 18px;
      display: none;
    }

    .loader {
      text-align: center;
      margin-block-start: 40px;
      display: none;
      font-size: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🚀 TaskApp</h2>
  <p id="welcome"></p>
  <button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

  <div class="top">
    <h2>Dashboard</h2>
    <input id="search" placeholder="Search tasks...">
  </div>

  <div class="filters">
    <button onclick="setFilter('all', this)" class="active">All</button>
    <button onclick="setFilter('completed', this)">Completed</button>
    <button onclick="setFilter('pending', this)">Pending</button>
  </div>

  <div class="add-box">
    <!-- FIXED: removed handleEnter -->
    <input id="taskInput" placeholder="Add new task...">
    <button onclick="addTask()">Add</button>
  </div>

  <div id="loader" class="loader">⏳ Loading...</div>

  <div id="taskList" class="task-box"></div>

  <div id="emptyState" class="empty">No tasks found 😴</div>

</div>

<script src="script.js"></script>

</body>
</html>
