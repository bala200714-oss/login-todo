<!DOCTYPE html>
<html>
<head>
<title>Pro Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  block-size: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
}

/* Glass Card */
.box {
  inline-size: 340px;
  padding: 30px;
  border-radius: 18px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  text-align: center;
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h2 {
  margin-block-end: 20px;
}

.input-box {
  position: relative;
}

input {
  inline-size: 100%;
  padding: 12px 40px 12px 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  outline: none;
}

.eye {
  position: absolute;
  inset-inline-end: 12px;
  inset-block-start: 18px;
  cursor: pointer;
}

button {
  inline-size: 48%;
  padding: 10px;
  margin-block-start: 10px;
  border: none;
  border-radius: 10px;
  background: #4facfe;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #00c6ff;
  transform: translateY(-2px);
}

.divider {
  margin: 15px 0;
  opacity: 0.7;
}

#loader {
  display: none;
  margin-block-start: 10px;
  font-size: 13px;
}

#msg {
  margin-block-start: 10px;
  min-block-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

  <h2>Welcome Back 👋</h2>

  <input id="username" placeholder="Username">

  <div class="input-box">
    <input id="password" type="password" placeholder="Password">
    <span class="eye" onclick="togglePassword()">👁️</span>
  </div>

  <div>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>
  </div>

  <div class="divider">or</div>

  <p style="font-size:12px;">Secure login system 🔐</p>

  <div id="loader">Processing...</div>
  <p id="msg"></p>

</div>

<script>
const API = "http://10.21.20.89:5000";

/* ========== HELPERS ========== */

function getValue(id) {
  return document.getElementById(id)?.value?.trim() || "";
}

function setLoading(state) {
  const loader = document.getElementById("loader");
  if (loader) loader.style.display = state ? "block" : "none";
}

function setMsg(text, color = "white") {
  const msg = document.getElementById("msg");
  if (!msg) return;
  msg.innerText = text;
  msg.style.color = color;
}

/* ========== UI ========== */

function togglePassword() {
  const pass = document.getElementById("password");
  if (!pass) return;
  pass.type = pass.type === "password" ? "text" : "password";
}

/* ========== SIGNUP ========== */

async function signup() {
  const u = getValue("username");
  const p = getValue("password");

  if (!u || !p) return setMsg("Fill all fields ⚠️", "red");

  setLoading(true);
  setMsg("Signing up...", "white");

  try {
    const res = await fetch(API + "/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if (res.ok) {
      setMsg("Signup successful ✅", "lightgreen");
    } else {
      setMsg(data.message + " ⚠️", "red");
    }
  } catch (err) {
    setMsg("Network error ⚠️", "red");
  }

  setLoading(false);
}

/* ========== LOGIN ========== */

async function login() {
  const u = getValue("username");
  const p = getValue("password");

  if (!u || !p) return setMsg("Enter username & password ⚠️", "red");

  setLoading(true);
  setMsg("Logging in...", "white");

  try {
    const res = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("token", data.token);
      setMsg("Login successful ✅", "lightgreen");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 500);
    } else {
      setMsg(data.message + " ❌", "red");
    }
  } catch (err) {
    setMsg("Network error ⚠️", "red");
  }

  setLoading(false);
}

/* ========== ENTER KEY SUPPORT ========== */

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
